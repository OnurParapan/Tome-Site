<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tome — E-posta doğrulandı</title>
<style>
  :root { --bg:#391E11; --ink:#F6EDDC; --muted:#C9AE8C; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--ink); font-family:Georgia, 'Times New Roman', serif; line-height:1.6; }
  .wrap { max-width:560px; margin:0 auto; padding:64px 24px; text-align:center; }
  img { width:120px; height:120px; border-radius:28px; margin-bottom:24px; }
  h1 { font-size:2rem; margin-bottom:12px; }
  p { color:var(--muted); font-size:1.1rem; margin-bottom:8px; }
  .en { margin-top:32px; }
</style>
</head>
<body>
<div class="wrap">
  <img src="icon.png" alt="Tome">
  <h1>E-postan doğrulandı ✓</h1>
  <p>Hesabın hazır. Tome uygulamasına dönüp e-posta ve şifrenle giriş yapabilirsin.</p>
  <div class="en">
    <h1>Email confirmed ✓</h1>
    <p>Your account is ready. Return to the Tome app and sign in with your email and password.</p>
  </div>
</div>
</body>
</html>
