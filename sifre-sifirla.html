<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tome — Yeni şifre belirle</title>
<style>
  :root { --bg:#391E11; --ink:#F6EDDC; --muted:#C9AE8C; --card:#4A2C1A; --accent:#C9A56F; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--ink); font-family:Georgia, 'Times New Roman', serif; line-height:1.6; }
  .wrap { max-width:480px; margin:0 auto; padding:64px 24px; text-align:center; }
  img { width:96px; height:96px; border-radius:22px; margin-bottom:20px; }
  h1 { font-size:1.8rem; margin-bottom:8px; }
  p { color:var(--muted); margin-bottom:20px; }
  input { width:100%; padding:14px; border-radius:12px; border:1px solid var(--card); background:#2E170C; color:var(--ink); font-size:1.05rem; margin-bottom:12px; }
  button { width:100%; padding:14px; border-radius:12px; border:none; background:var(--accent); color:#2E170C; font-size:1.05rem; font-weight:bold; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .msg { margin-top:16px; min-height:1.5em; }
  .ok { color:#9BD39B; } .err { color:#F2A1A1; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <img src="icon.png" alt="Tome">
  <h1>Yeni şifre belirle</h1>
  <p>Set a new password</p>
  <form id="form" class="hidden">
    <input id="pw1" type="password" placeholder="Yeni şifre (en az 8 karakter) / New password" minlength="8" required>
    <input id="pw2" type="password" placeholder="Tekrar / Repeat" minlength="8" required>
    <button id="btn" type="submit">Şifreyi güncelle / Update password</button>
  </form>
  <div id="msg" class="msg">Bağlantı doğrulanıyor… / Verifying link…</div>
</div>
<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
  const supabase = createClient(
    "https://yhtiyuqnlnmqqqjiatcx.supabase.co",
    "sb_publishable_wxJQ8zxk2w4DApQ_SFb8dw_I1_cbsVn",
    { auth: { detectSessionInUrl: true, flowType: "implicit" } }
  );
  const form = document.getElementById("form");
  const msg = document.getElementById("msg");
  const btn = document.getElementById("btn");

  function ready() {
    form.classList.remove("hidden");
    msg.textContent = "";
  }
  function fail(text) {
    msg.className = "msg err";
    msg.textContent = text;
  }

  // the recovery link puts the session in the URL hash
  const { data } = await supabase.auth.getSession();
  if (data.session) ready();
  supabase.auth.onAuthStateChange((event, session) => {
    if (session && (event === "PASSWORD_RECOVERY" || event === "SIGNED_IN")) ready();
  });
  setTimeout(async () => {
    const { data } = await supabase.auth.getSession();
    if (!data.session && form.classList.contains("hidden")) {
      fail("Bağlantı geçersiz ya da süresi dolmuş. Uygulamadan yeniden 'Şifremi unuttum' de. / Link is invalid or expired — request a new one in the app.");
    }
  }, 4000);

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const pw1 = document.getElementById("pw1").value;
    const pw2 = document.getElementById("pw2").value;
    if (pw1 !== pw2) return fail("Şifreler eşleşmiyor. / Passwords do not match.");
    btn.disabled = true;
    const { error } = await supabase.auth.updateUser({ password: pw1 });
    if (error) { btn.disabled = false; return fail(error.message); }
    await supabase.auth.signOut();
    form.classList.add("hidden");
    msg.className = "msg ok";
    msg.textContent = "Şifren güncellendi ✓ Uygulamaya dönüp yeni şifrenle giriş yap. / Password updated — sign in with it in the app.";
  });
</script>
</body>
</html>
